name: Task
description: Docs, evolution of existing code, infra or other non-feature work
title: "evol(scope): "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use a title prefix matching the type of work: `docs(scope): ...`, `evol(scope): ...` or `chore(scope): ...`.
        Add the matching labels (`docs`, `evol`, `core`, `api`, `web`, `mobile`, `infra`, `data`, `test`, `a11y`, `design`).
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Break the work down into a checklist.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be considered done?
      value: |
        - [ ] 
    validations:
      required: true
