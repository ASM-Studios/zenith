version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(infra)"
    labels: [infra]

  - package-ecosystem: docker
    directories:
      - /
      - /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(infra)"
    labels: [infra]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(infra)"
    labels: [infra]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [infra]
