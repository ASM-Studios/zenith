name: Dev environment

on:
  pull_request:
    paths:
      - apps/mobile/scripts/**
      - apps/mobile/src/dev/**
      - devenv.nix
      - .github/workflows/dev-environment.yml
  workflow_dispatch:

concurrency:
  group: dev-environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:42"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator on a clean ${{ matrix.image }}
        run: bash apps/mobile/scripts/dev-env/run-in-docker.sh ${{ matrix.image }}
