name: Dev environment

on:
  pull_request:
    paths:
      - apps/mobile/scripts/**
      - apps/mobile/src/dev/**
      - devenv.nix
      - .github/workflows/dev-environment.yml
  workflow_dispatch:

concurrency:
  group: dev-environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:42"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator on a clean ${{ matrix.image }}
        run: bash apps/mobile/scripts/dev-env/run-in-docker.sh ${{ matrix.image }}

  ios-simulator:
    name: iOS simulator on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open the app in the iOS simulator
        run: bash apps/mobile/scripts/dev-env/ios-check.sh "$RUNNER_TEMP/ios-simulator.png"

      - name: Keep the simulator screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/ios-simulator.png
          if-no-files-found: ignore
