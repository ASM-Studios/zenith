name: Release SBOM

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    name: Build SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Workspace SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-workspace.cdx.json
          upload-artifact: false

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t zenith-api:release .

      - name: Image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: zenith-api:release
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom-*.cdx.json

  attest:
    name: Attest and attach SBOMs
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom-workspace.cdx.json sbom-image.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest workspace SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: sbom-workspace.cdx.json
          sbom-path: sbom-workspace.cdx.json

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: sbom-image.cdx.json
          sbom-path: sbom-image.cdx.json
