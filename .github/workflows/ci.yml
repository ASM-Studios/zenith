name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: npm run lint:workflows

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  web-screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app
        run: npm run build -w @zenith/web

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Take the screenshots
        run: npm run screenshots -w @zenith/web -- "$RUNNER_TEMP/screenshots"

      - name: Keep web-home.png
        id: home
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/screenshots/web-home.png
          archive: false
          if-no-files-found: ignore

      - name: Keep web-home-fr.png
        id: home-fr
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/screenshots/web-home-fr.png
          archive: false
          if-no-files-found: ignore

      - name: Keep web-not-found.png
        id: not-found
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/screenshots/web-not-found.png
          archive: false
          if-no-files-found: ignore

      - name: Link the screenshots
        if: ${{ !cancelled() }}
        env:
          HOME_URL: ${{ steps.home.outputs.artifact-url }}
          HOME_FR_URL: ${{ steps.home-fr.outputs.artifact-url }}
          NOT_FOUND_URL: ${{ steps.not-found.outputs.artifact-url }}
        run: bash .github/scripts/link-screenshots.sh web-home.png "$HOME_URL" web-home-fr.png "$HOME_FR_URL" web-not-found.png "$NOT_FOUND_URL"
