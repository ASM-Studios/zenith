x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localhost/zenith-api:latest
    command: ["node", "apps/api/dist/db/migrate.js"]
    environment:
      DATABASE_URL: *database-url
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: localhost/zenith-api:latest
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: *database-url
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${API_PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  backend:

volumes:
  pgdata:
