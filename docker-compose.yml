x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
x-redis-url: &redis-url redis://redis:${REDIS_PORT:-6379}

services:
  db:
    image: docker.io/library/postgres:19@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: docker.io/library/redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: zenith-api:latest
    command: ["apps/api/dist/db/migrate.js"]
    environment:
      DATABASE_URL: *database-url
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: zenith-api:latest
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MET_NORWAY_CONTACT: ${MET_NORWAY_CONTACT:-https://github.com/ASM-Studios/zenith}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:' + process.env.API_PORT + '/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${WEB_SITE_URL:-}
    image: zenith-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: zenith-api:latest
    restart: unless-stopped
    init: true
    command: ["apps/api/dist/worker.js"]
    environment:
      REDIS_URL: *redis-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

networks:
  backend:
  frontend:

volumes:
  pgdata:
  redisdata:
