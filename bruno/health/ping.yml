info:
  name: "Ping"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/ping"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers pong", function () {
          expect(res.body).to.equal("pong");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
