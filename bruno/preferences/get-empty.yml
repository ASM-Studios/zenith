info:
  name: "Get preferences of a new user"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/me/preferences"

runtime:
  scripts:
    - type: tests
      code: |-
        test("is empty", function () {
          expect(res.body.sourcePreferences).to.eql({});
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
