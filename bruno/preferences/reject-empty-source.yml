info:
  name: "Reject an empty source name"
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/api/me/preferences"
  body:
    type: json
    data: |-
      {
        "sourcePreferences": {
          "weather": ""
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects the body and names the field", function () {
          expect(res.body.error).to.equal("invalid_body");
          expect(res.body.issues[0].path.join(".")).to.equal("sourcePreferences.weather");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
