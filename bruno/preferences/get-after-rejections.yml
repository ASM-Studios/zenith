info:
  name: "Get preferences untouched by the rejected requests"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/me/preferences"

runtime:
  scripts:
    - type: tests
      code: |-
        test("still holds the last valid value", function () {
          expect(res.body.sourcePreferences).to.eql({ weather: "metno" });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
