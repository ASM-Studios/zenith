info:
  name: "Get the saved preferences"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/me/preferences"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns what was saved", function () {
          expect(res.body.sourcePreferences).to.eql({ weather: "open-meteo", aurora: "noaa" });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
