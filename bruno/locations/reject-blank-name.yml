info:
  name: "Reject a blank name"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/me/locations"
  body:
    type: json
    data: |-
      {
        "locations": [
          {
            "name": "   ",
            "latitude": 48.8566,
            "longitude": 2.3522
          }
        ]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects the body and names the field", function () {
          expect(res.body.error).to.equal("invalid_body");
          expect(res.body.issues[0].path.join(".")).to.equal("locations.0.name");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
