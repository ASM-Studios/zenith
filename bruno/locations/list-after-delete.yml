info:
  name: "List after the delete"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/me/locations"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("tokyoId", res.body.locations.find((l) => l.name === "Tokyo").id);
    - type: tests
      code: |-
        test("lists 4 location(s)", function () {
          expect(res.body.locations).to.have.lengthOf(4);
        });
        test("no longer lists Paris", function () {
          expect(res.body.locations.map((l) => l.name)).to.not.include("Paris, France");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
