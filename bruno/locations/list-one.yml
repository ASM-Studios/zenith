info:
  name: "List the stored location"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/me/locations"

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists 1 location(s)", function () {
          expect(res.body.locations).to.have.lengthOf(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
