info:
  name: "Get preferences without session"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/me/preferences"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers unauthorized", function () {
          expect(res.body.message).to.equal("unauthorized");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
