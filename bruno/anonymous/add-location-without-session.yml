info:
  name: "Add location without session"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/me/locations"
  body:
    type: json
    data: |-
      {
        "locations": [
          {
            "name": "Paris",
            "latitude": 48.8566,
            "longitude": 2.3522
          }
        ]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers unauthorized", function () {
          expect(res.body.message).to.equal("unauthorized");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
