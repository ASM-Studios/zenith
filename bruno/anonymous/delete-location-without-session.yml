info:
  name: "Delete location without session"
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/me/locations/00000000-0000-4000-8000-000000000000"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers unauthorized", function () {
          expect(res.body.message).to.equal("unauthorized");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
