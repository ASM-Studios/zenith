info:
  name: "Sign in with a wrong password"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-in/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email": "{{emailA}}",
        "password": "not-the-password"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        await bru.sleep(10500);
    - type: tests
      code: |-
        test("does not say which part was wrong", function () {
          expect(res.body.code).to.equal("INVALID_EMAIL_OR_PASSWORD");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
