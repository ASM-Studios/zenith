info:
  name: "Delete the account with a wrong password"
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/auth/delete-user"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "password": "not-the-password"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("refuses the wrong password", function () {
          expect(res.body.code).to.equal("INVALID_PASSWORD");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
