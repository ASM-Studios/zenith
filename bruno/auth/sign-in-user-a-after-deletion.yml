info:
  name: "Sign in user A after the deletion"
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-in/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email": "{{emailA}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        await bru.sleep(10500);
    - type: tests
      code: |-
        test("returns user A", function () {
          expect(res.body.user.email).to.equal(bru.getVar("emailA"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
