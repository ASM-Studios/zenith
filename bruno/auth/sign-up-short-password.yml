info:
  name: "Sign up with a short password"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-up/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email": "{{emailShort}}",
        "password": "short",
        "name": "Zenith Tester"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("names the password rule", function () {
          expect(res.body.code).to.equal("PASSWORD_TOO_SHORT");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
