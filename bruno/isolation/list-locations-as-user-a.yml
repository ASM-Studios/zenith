info:
  name: "User A lists locations"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/me/locations"

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists 4 location(s)", function () {
          expect(res.body.locations).to.have.lengthOf(4);
        });
        test("keeps own names", function () {
          const names = res.body.locations.map((l) => l.name);
          expect(names).to.include("Tokyo");
          expect(names).to.not.include("Tokyo (B)");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
