name: zenith-dev

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
x-redis-url: &redis-url redis://redis:${REDIS_PORT:-6379}

x-dev-service: &dev-service
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: zenith-dev:latest
  restart: unless-stopped
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/web/node_modules

services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    networks:
      - backend

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    networks:
      - backend

  migrate:
    <<: *dev-service
    restart: "no"
    command: ["node", "--conditions=@zenith/source", "apps/api/src/db/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *dev-service
    command: ["npm", "run", "dev", "--workspace=@zenith/api"]
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MET_NORWAY_CONTACT: ${MET_NORWAY_CONTACT:-https://github.com/ASM-Studios/zenith}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + process.env.API_PORT + '/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *dev-service
    init: true
    command: ["npm", "run", "worker:dev", "--workspace=@zenith/api"]
    environment:
      REDIS_URL: *redis-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  web:
    <<: *dev-service
    command: ["npm", "run", "dev", "--workspace=@zenith/web", "--", "--host", "0.0.0.0"]
    environment:
      API_UPSTREAM: http://api:${API_PORT:-3000}
      WATCH_POLLING: ${WATCH_POLLING:-false}
    ports:
      - "${WEB_PORT:-8080}:5173"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  backend:
  frontend:

volumes:
  pgdata:
  redisdata:
